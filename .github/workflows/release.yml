# Tagged release. The installer jobs are the same workflow CI calls, so the
# build a tag publishes is the build a pull request already rehearsed. Run this
# workflow manually to dry-run a release: everything builds and uploads as
# artifacts, and nothing is published unless `publish` is set on a tag ref.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release for the checked-out tag.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Resolve the release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/version.ts check
          version="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version)')"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            node scripts/verify-server-release-inputs.ts "$version" "$TAG"
          else
            echo "Not a tag ref; skipping the tag-to-version check."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build release installers
    needs: validate
    uses: ./.github/workflows/build-installers.yml
    with:
      artifact-retention-days: 7
    secrets: inherit

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    # A dry run stops after the build: publishing needs a tag ref and either the
    # tag push itself or an explicit `publish` input.
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.inputs.publish == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true
      - name: Create checksums
        run: |
          set -euo pipefail
          cd release-assets
          files=(Awen-* awen-server-*.tar.gz)
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish prerelease
        if: needs.validate.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --prerelease \
            --title "Awen $VERSION" \
            --generate-notes
      - name: Publish stable release
        if: needs.validate.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --title "Awen $VERSION" \
            --generate-notes
