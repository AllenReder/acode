name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
      - name: Check product versions
        run: node scripts/version.ts check
      - name: Match the tag to the product version
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version)')"
          node scripts/verify-server-release-inputs.ts "$version" "$TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  daemon-linux-x64:
    name: Linux x64 daemon
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Linux x64 daemon package
        run: node scripts/build-server-package.ts --platform linux --arch x64 --version "${{ needs.validate.outputs.version }}"
      - name: Verify checksum and smoke-test the daemon
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd release-server
          archive="awen-server-$VERSION-linux-x64.tar.gz"
          sha256sum -c SHA256SUMS
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          stem="awen-server-$VERSION-linux-x64"
          tar -xzf "$archive" -C "$scratch"
          awen="$scratch/$stem/bin/awen"
          test "$("$awen" --version)" = "awen v$VERSION"
          export AWEN_HOME="$scratch/awen-home"
          export AWEN_NO_BROWSER=1
          "$awen" daemon start --json
          "$awen" daemon status --json
          "$awen" daemon stop --confirm --json
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp "$archive" SHA256SUMS "$GITHUB_WORKSPACE/release-assets/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-linux-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    name: macOS ${{ matrix.arch }} desktop
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" || -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "macOS release requires Developer ID and notarization secrets." >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/awen-developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          keychain="$RUNNER_TEMP/awen-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "The imported certificate is not a Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Stage desktop daemon and Node runtime
        run: node scripts/stage-desktop-runtime.ts
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
      - name: Build desktop installer
        run: pnpm --filter @awen/desktop build --config src-tauri/tauri.macos.conf.json --config src-tauri/tauri.release.conf.json --target "${{ matrix.target }}"
      - name: Collect notarized macOS installer
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bundles="apps/desktop/src-tauri/target/$TARGET/release/bundle/dmg"
          shopt -s nullglob
          files=("$bundles"/*.dmg)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No macOS DMG was produced in $bundles" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            xcrun stapler validate "$file"
            cp "$file" "release-assets/Awen-$VERSION-macos-$ARCH.dmg"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  desktop-windows-x64:
    name: Windows x64 desktop
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage desktop daemon and Node runtime
        run: node scripts/stage-desktop-runtime.ts
      - name: Install Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Build prerelease NSIS installer
        if: contains(needs.validate.outputs.version, '-')
        run: pnpm --filter @awen/desktop build --config src-tauri/tauri.release.conf.json --bundles nsis
      - name: Build stable desktop installers
        if: ${{ !contains(needs.validate.outputs.version, '-') }}
        run: pnpm --filter @awen/desktop build --config src-tauri/tauri.release.conf.json
      - name: Collect unsigned Windows installers
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $assets = "release-assets"
          New-Item -ItemType Directory -Force $assets | Out-Null
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          $files = @(Get-ChildItem $bundleRoot -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi" })
          if ($files.Count -eq 0) { throw "No Windows installer was produced in $bundleRoot" }
          foreach ($file in $files) {
            Copy-Item $file.FullName (Join-Path $assets "Awen-$env:VERSION-windows-x64$($file.Extension)")
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - validate
      - daemon-linux-x64
      - desktop-macos
      - desktop-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true
      - name: Create checksums
        run: |
          set -euo pipefail
          cd release-assets
          files=(Awen-* awen-server-*.tar.gz)
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish prerelease
        if: contains(needs.validate.outputs.version, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --prerelease \
            --title "Awen $VERSION" \
            --generate-notes
      - name: Publish stable release
        if: ${{ !contains(needs.validate.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --title "Awen $VERSION" \
            --generate-notes
