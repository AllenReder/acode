name: Release server package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version, for example 0.0.42"
        required: true
        type: string
      commit:
        description: "Commit SHA to build"
        required: true
        type: string
      tag:
        description: "Release tag; defaults to v<version>"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Linux x64 prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Check inputs
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: node scripts/verify-server-release-inputs.ts "$VERSION" "$TAG"
      - name: Resolve checked-out commit
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4888f539a52785 # v4.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build server package
        run: node scripts/build-server-package.ts --platform linux --arch x64 --version "${{ inputs.version }}"
      - name: Verify final checksum bytes
        run: |
          cd release-server
          archive="acode-server-${{ inputs.version }}-linux-x64.tar.gz"
          test -f "$archive"
          sha256sum -c SHA256SUMS
      - name: Smoke-test server archive
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          archive="release-server/acode-server-${{ inputs.version }}-linux-x64.tar.gz"
          stem="acode-server-${{ inputs.version }}-linux-x64"
          tar -xzf "$archive" -C "$scratch"
          acode="$scratch/$stem/bin/acode"
          "$acode" --version
          export ACODE_HOME="$scratch/acode-home"
          export T3CODE_NO_BROWSER=1
          "$acode" daemon start --json
          "$acode" daemon status --json
          "$acode" daemon stop --confirm --json
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="${TAG:-v$VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Delete the test release before publishing this version." >&2
            exit 1
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.checkout.outputs.sha }}" \
            --prerelease \
            --title "ACode daemon $VERSION (test prerelease)" \
            --notes "Test prerelease for remote daemon installation. It is not a stable release and may be deleted after testing. Installed daemons keep running after deletion, but new installs cannot download this exact asset and must use the local package fallback or a newer release." \
            release-server/acode-server-"$VERSION"-linux-x64.tar.gz \
            release-server/SHA256SUMS
